name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  CC: clang

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.1.0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make libcurl4-openssl-dev libx11-dev libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
      - run: make game headless test

  asan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.1.0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make libcurl4-openssl-dev libx11-dev libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
      - run: make asan

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make cppcheck libcurl4-openssl-dev libx11-dev libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
      - run: make format-check tidy cppcheck
